name: Set up the build tools
description: Installs the Rust toolchain pinned in rust-toolchain.toml, pnpm, Node.js and the npm packages.

runs:
  using: composite
  steps:
    # Clean Linux containers have no rustup.
    - name: Install rustup
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 --retry 3 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install
        rustc --version

    # Node.js first: in clean containers, pnpm/action-setup needs npm to install pnpm.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install npm packages
      shell: bash
      run: pnpm install --frozen-lockfile
