name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the Release workflow for release PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the bundled FFmpeg
        run: pnpm fetch-ffmpeg

      - name: Type-check the UI and tests
        run: pnpm check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run UI tests
        run: pnpm test:ui

      - name: Upload UI test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

      - name: Build the UI
        run: pnpm ui:build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: End-to-end (${{ matrix.os }})
    # tauri-driver has no macOS support, so the built app is only tested on
    # Linux (WebKitGTK) and Windows (WebView2).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build and WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # msedgedriver must match the installed WebView2 version.
      - name: Install a matching Edge WebDriver
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      # WebView2 150+ ignores msedgedriver's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS when the
      # app runs elevated, as it does on GitHub runners, so the debugging port is set by policy.
      - name: Allow WebView2 remote debugging
        if: runner.os == 'Windows'
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name "converter.exe" -Value "--remote-debugging-port=0" -Force | Out-Null

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the bundled FFmpeg
        run: pnpm fetch-ffmpeg

      - name: Build the app
        run: pnpm tauri build --debug --no-bundle

      - name: Run end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm test:e2e

      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e

      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-logs-${{ matrix.os }}
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/com.squ1ggly.converter/logs/' || '~/.local/share/com.squ1ggly.converter/logs/' }}
          retention-days: 7
