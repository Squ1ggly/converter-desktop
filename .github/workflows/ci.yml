name: CI

on:
  push:
    branches: [main, ci/fix-e2e]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the bundled FFmpeg
        run: pnpm fetch-ffmpeg

      - name: Type-check the UI and tests
        run: pnpm check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run UI tests
        run: pnpm test:ui

      - name: Upload UI test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

      - name: Build the UI
        run: pnpm ui:build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: End-to-end (${{ matrix.os }})
    # tauri-driver has no macOS support, so the built app is only tested on
    # Linux (WebKitGTK) and Windows (WebView2).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build and WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb
          dpkg -L webkitgtk-webdriver | grep -i driver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # msedgedriver must match the installed WebView2 version.
      - name: Install a matching Edge WebDriver
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the bundled FFmpeg
        run: pnpm fetch-ffmpeg

      - name: Build the app
        run: pnpm tauri build --debug --no-bundle

      - name: Run end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm test:e2e

      - name: Debug WebDriver (Windows)
        if: runner.os == 'Windows'
        run: ./.github/e2e-debug.ps1

      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-${{ matrix.os }}
          path: |
            e2e-debug/
            ${{ runner.os == 'Windows' && '~/AppData/Local/com.squ1ggly.converter/logs/' || '~/.local/share/com.squ1ggly.converter/logs/' }}
          retention-days: 7
