name: Release

# On main, release-please keeps a release PR up to date. Merging it tags the commit and creates a
# draft release. The installers are then built and tested on every platform, attached to the
# draft with the FFmpeg source, and the release is published only if every job passed.
# "Run workflow" builds and tests the installers without releasing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release half way. A newer push waits for the running one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # github-actions opens the release PR, so the runs its pull_request events create wait for
      # a maintainer's approval. Start CI on its branch after every push to main instead, so its
      # checks stay current whether or not release-please changed it this time.
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // empty')
          if [ -z "$release_branch" ]; then
            echo "No release PR is open."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"

  installers:
    needs: release-please
    # !cancelled() lets this run on manual runs, where release-please is skipped.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    uses: ./.github/workflows/installers.yml
    with:
      sign: true
      # Build the tagged release commit, not whichever commit started this run.
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [release-please, installers]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach the installers and the FFmpeg source to the draft release
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
