<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Converter</title>
    <script>
      // Applies the saved theme before the first paint, so a dark window never flashes
      // light. Reads the same setting as mode-watcher ("light", "dark" or "system").
      // Tauri adds this script's hash to the content security policy when it builds.
      (() => {
        let savedMode = null;
        try {
          savedMode = localStorage.getItem("mode-watcher-mode");
        } catch {
          savedMode = null;
        }
        const mode = savedMode ?? "system";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = mode === "dark" || (mode === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
